name: Stock Update & Deploy

# No `schedule:` trigger here — GitHub's own cron for scheduled workflows is
# unreliable on this plan (confirmed 2026-11-27: runs meant to fire every
# hour were actually landing 7-11 hours apart), so this is manual-only:
# `workflow_dispatch` from the Actions tab, a `push` to main/master, or the
# dashboard's own "立即更新資料" button (docs/js/app.js builds a pre-filled
# GitHub "New Issue" and opens it — same owner-gated pattern as
# stock-request.yml, see the job-level `if:` below — so the static site
# never needs to hold a credential to trigger this).
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 允許手動觸發測試
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# 設定全域環境變數為台灣時區
env:
  TZ: Asia/Taipei

concurrency:
  group: "pages"
  # 每次觸發（push、手動觸發或按鈕送出的 Issue）都會用「觸發當下」的 commit 執行，不是「執行當下」
  # main 最新的 commit。若保留 false，快速連續 push 修正時，較早觸發、還在排隊的
  # 執行會在較晚的修正已經上線後才真正開始跑，用的還是舊版程式碼，很容易讓人誤以為
  # 「明明推了修正還是失敗」。改成 true：新的執行一開始就會取消還在排隊/執行中的
  # 舊執行，確保永遠只有「最新 commit」在跑，也省下重複跑的運算資源。
  cancel-in-progress: true

jobs:
  build:
    # Gate the issues-triggered path to the repo owner, same as
    # stock-request.yml — an update-request issue opened by anyone else is
    # left completely untouched (job shows as "skipped", no steps run).
    if: |
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.title, '[手動更新]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          # `issues` events have no branch ref of their own (unlike push),
          # so this always checks out/pushes to the default branch rather
          # than relying on github.ref_name — same as stock-request.yml.
          ref: ${{ github.event.repository.default_branch }}
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 啟用 pip 快取，加快套件安裝速度
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run stock data update
        run: |
          echo "開始更新資料 (台灣時間): $(date)"
          cd src
          python main.py
          echo "更新完成 (台灣時間): $(date)"
        
      - name: Check for changes
        id: check_changes
        run: |
          # 檢查 data 資料夾是否有變動
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "偵測到資料變動"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "資料無變動"
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          # Commit 訊息會自動使用台灣時間
          git commit -m "📊 自動更新資料 - $(date +'%Y-%m-%d %H:%M') (台北時間)"
          
          # 在 push 前拉取遠端最新變更，使用 rebase 避免產生多餘的合併節點。
          # 這個 commit 只會動到 data/（機器產生、每次執行都會被覆蓋的資料），
          # 所以發生衝突時可以放心採用「這次 rebase 正在套用的 commit」（也就是
          # 這次剛產生的最新資料）── 對 git rebase 而言那是 -X theirs，
          # 而不是字面上看起來相反的 -X ours。
          if ! git pull --rebase -X theirs origin ${{ github.event.repository.default_branch }}; then
            echo "Rebase 發生非預期衝突，改用一般 merge 並保留這次最新產生的資料"
            git rebase --abort
            git pull --no-rebase -X ours origin ${{ github.event.repository.default_branch }}
          fi

          # 推送至預設分支
          git push origin ${{ github.event.repository.default_branch }}
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare docs folder
        run: |
          # 確保最新的 data 檔案被複製到 docs/data 以供網頁讀取
          mkdir -p docs/data
          cp -r data/* docs/data/ 2>/dev/null || true
          touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comment on manual-update issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: '✅ 資料已更新並部署完成。'
            });

      - name: Close manual-update issue
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
              state_reason: 'completed'
            });