name: Hourly Stock Update & Deploy

on:
  schedule:
    # 每小時執行一次 (例如 01:00, 02:00...)
    - cron: '0 * * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch: # 允許手動觸發測試

permissions:
  contents: write
  pages: write
  id-token: write

# 設定全域環境變數為台灣時區
env:
  TZ: Asia/Taipei

concurrency:
  group: "pages"
  # 每次觸發（push 或每小時排程）都會用「觸發當下」的 commit 執行，不是「執行當下」
  # main 最新的 commit。若保留 false，快速連續 push 修正時，較早觸發、還在排隊的
  # 執行會在較晚的修正已經上線後才真正開始跑，用的還是舊版程式碼，很容易讓人誤以為
  # 「明明推了修正還是失敗」。改成 true：新的執行一開始就會取消還在排隊/執行中的
  # 舊執行，確保永遠只有「最新 commit」在跑，也省下重複跑的運算資源。
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # 啟用 pip 快取，加快套件安裝速度
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run stock data update
        run: |
          echo "開始更新資料 (台灣時間): $(date)"
          cd src
          python main.py
          echo "更新完成 (台灣時間): $(date)"
        
      - name: Check for changes
        id: check_changes
        run: |
          # 檢查 data 資料夾是否有變動
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "偵測到資料變動"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "資料無變動"
          fi
          
      - name: Commit and push changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/
          # Commit 訊息會自動使用台灣時間
          git commit -m "📊 自動更新資料 - $(date +'%Y-%m-%d %H:%M') (台北時間)"
          
          # 在 push 前拉取遠端最新變更，使用 rebase 避免產生多餘的合併節點。
          # 這個 commit 只會動到 data/（機器產生、每小時都會被覆蓋的資料），
          # 所以發生衝突時可以放心採用「這次 rebase 正在套用的 commit」（也就是
          # 這次剛產生的最新資料）── 對 git rebase 而言那是 -X theirs，
          # 而不是字面上看起來相反的 -X ours。
          if ! git pull --rebase -X theirs origin ${{ github.ref_name }}; then
            echo "Rebase 發生非預期衝突，改用一般 merge 並保留這次最新產生的資料"
            git rebase --abort
            git pull --no-rebase -X ours origin ${{ github.ref_name }}
          fi

          # 推送至觸發工作流程的當前分支
          git push origin ${{ github.ref_name }}
          
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Prepare docs folder
        run: |
          # 確保最新的 data 檔案被複製到 docs/data 以供網頁讀取
          mkdir -p docs/data
          cp -r data/* docs/data/ 2>/dev/null || true
          touch docs/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4